name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  unity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2022.3.45f1
          targetPlatform: iOS
          buildMethod: BuildScript.BuildIOS
      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS

  ipa:
    needs: unity
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: xcode
      - name: Build unsigned IPA
        run: |
          cd xcode
          chmod -R +x . || true
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone \
            -configuration Release -sdk iphoneos -derivedDataPath out \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R out/Build/Products/Release-iphoneos/*.app Payload/
          zip -r ../Capital-Fall.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Capital-Fall-ipa
          path: Capital-Fall.ipa
