name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sL -o godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          curl -sL -o templates.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip
          unzip -q templates.tpz -d tpl
          DEST="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$DEST"
          cp -R tpl/templates/* "$DEST/"

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          Godot.app/Contents/MacOS/Godot --headless --path . --import || true
          Godot.app/Contents/MacOS/Godot --headless --path . --export-release "iOS" build/ios/CapitalFall.ipa
          ls -R build/ios | head -50

      - name: Build unsigned IPA
        run: |
          cd build/ios
          xcodebuild -project CapitalFall.xcodeproj -scheme CapitalFall \
            -configuration Release -sdk iphoneos -derivedDataPath out \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R out/Build/Products/Release-iphoneos/*.app Payload/
          zip -qr ../../CapitalFall.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Capital-Fall-ipa
          path: CapitalFall.ipa
